<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Página no encontrada · Steven Pallo</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#05070D" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #05070d; --text: #e8edf5; --muted: #8a94a8; --cyan: #22d3ee; --violet: #8b5cf6; --grad: linear-gradient(120deg, #22d3ee, #6366f1 55%, #8b5cf6); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(60% 50% at 50% 0%, rgba(99, 102, 241, .18), transparent 70%), var(--bg);
      color: var(--text); font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    }
    main { width: min(620px, 100%); text-align: center; }
    h1 {
      font-family: 'Space Grotesk', sans-serif; font-size: clamp(6rem, 26vw, 11rem); line-height: 1; letter-spacing: -.06em;
      background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: glitch 3s steps(1) infinite;
    }
    @keyframes glitch {
      0%, 92%, 100% { transform: none; text-shadow: none; }
      93% { transform: translate(-3px, 1px) skewX(-6deg); }
      95% { transform: translate(3px, -1px) skewX(6deg); }
      97% { transform: translate(-1px, 0); }
    }
    .term {
      margin: 28px 0 32px; text-align: left; border-radius: 16px; overflow: hidden;
      background: rgba(7, 10, 18, .94); border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .85);
    }
    .bar { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid rgba(255, 255, 255, .08); background: rgba(255, 255, 255, .03); }
    .bar i { width: 12px; height: 12px; border-radius: 50%; }
    .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
    .body { padding: 18px 20px; font-size: .88rem; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
    .u { color: #3fb950; font-weight: 700; } .p { color: #58a6ff; font-weight: 700; } .r { color: #ff7b72; } .m { color: var(--muted); }
    .caret { display: inline-block; width: .55em; height: 1.1em; vertical-align: -.2em; background: var(--cyan); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    a {
      display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; border-radius: 14px;
      background: var(--grad); color: #04121a; font-weight: 700; text-decoration: none;
      box-shadow: 0 12px 40px -12px rgba(34, 211, 238, .55); transition: transform .3s, box-shadow .3s;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 18px 50px -10px rgba(139, 92, 246, .6); }
    @media (prefers-reduced-motion: reduce) { h1, .caret { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <div class="term">
      <div class="bar"><i></i><i></i><i></i></div>
      <div class="body"><span class="u">steven@uta</span>:<span class="p">~</span>$ cd <span id="path">/pagina</span>
<span class="r">bash: cd: <span id="path2">/pagina</span>: No existe el archivo o directorio</span>
<span class="m"># Parece que esta página se perdió en la red… 🛰️</span>
<span class="u">steven@uta</span>:<span class="p">~</span>$ <span class="caret"></span></div>
    </div>
    <a href="/">← Volver al inicio</a>
  </main>
  <script>
    const path = decodeURIComponent(location.pathname);
    document.getElementById('path').textContent = path;
    document.getElementById('path2').textContent = path;
  </script>
</body>
</html>
